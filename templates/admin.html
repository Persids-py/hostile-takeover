<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>管理後台 · 惡意併購</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#0a0e18;color:#e2e8f0;
  font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;min-height:100vh;
  background-image:radial-gradient(ellipse at 15% 0%,#162040 0%,transparent 55%),
    radial-gradient(ellipse at 85% 100%,#1a0d2a 0%,transparent 55%);
}
/* ── HEADER ── */
#header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 24px;background:#0d1628;border-bottom:1px solid #1e2a3a;
}
#header h1{color:#f0c040;font-size:1rem;letter-spacing:2px}
#header-right{display:flex;align-items:center;gap:16px}
#refresh-indicator{font-size:.75rem;color:#64748b}
.btn-logout{
  padding:6px 14px;border-radius:7px;border:1px solid #2d3748;
  background:#1a2233;color:#94a3b8;font-size:.8rem;cursor:pointer;
  text-decoration:none;transition:background .15s;
}
.btn-logout:hover{background:#2d3748;color:#e2e8f0}

/* ── LAYOUT ── */
#main{padding:24px;display:flex;flex-direction:column;gap:20px;max-width:1200px;margin:0 auto}

/* ── STATS BAR ── */
#stats{display:flex;gap:12px;flex-wrap:wrap}
.stat-card{
  background:#111827;border:1px solid #1e2a3a;border-radius:10px;
  padding:14px 22px;display:flex;flex-direction:column;gap:4px;min-width:140px;
}
.stat-label{color:#64748b;font-size:.72rem;letter-spacing:1px;text-transform:uppercase}
.stat-value{font-size:1.8rem;font-weight:700;color:#f0c040}

/* ── BROADCAST ── */
#broadcast-panel{
  background:#111827;border:1px solid #1e2a3a;border-radius:12px;padding:18px 20px;
  display:flex;gap:10px;align-items:center;
}
#broadcast-panel input{
  flex:1;padding:9px 13px;border-radius:7px;border:1px solid #2d3748;
  background:#0a0e18;color:#e2e8f0;font-size:.88rem;
}
#broadcast-panel input:focus{outline:none;border-color:#3b82f6}
.btn-broadcast{
  padding:9px 18px;border-radius:7px;border:none;
  background:#1d4ed8;color:#fff;font-size:.85rem;font-weight:600;cursor:pointer;
  white-space:nowrap;transition:background .15s;
}
.btn-broadcast:hover{background:#3b82f6}
#broadcast-status{font-size:.78rem;color:#22c55e;display:none}

/* ── ROOMS ── */
#rooms-header{
  display:flex;align-items:center;justify-content:space-between;
}
#rooms-header h2{font-size:.9rem;color:#94a3b8;letter-spacing:1px;text-transform:uppercase}
#empty-msg{color:#64748b;text-align:center;padding:40px;font-size:.9rem}

.room-card{
  background:#111827;border:1px solid #1e2a3a;border-radius:12px;overflow:hidden;
  margin-bottom:12px;
}
.room-header{
  display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;
  transition:background .15s;
}
.room-header:hover{background:#1a2233}
.room-code{
  font-size:1.1rem;font-weight:700;color:#f0c040;
  background:#1a1300;border:1px solid #b45309;border-radius:6px;
  padding:3px 10px;letter-spacing:2px;
}
.phase-badge{
  padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700;letter-spacing:.5px;
}
.phase-lobby{background:#1e2533;color:#94a3b8}
.phase-draft_identity{background:#1e1040;color:#c4b5fd}
.phase-draft_role{background:#1e1040;color:#c4b5fd}
.phase-choose_card,.phase-in_transit,.phase-discard{background:#0f2d1a;color:#4ade80}
.phase-game_over{background:#1f0707;color:#f87171}
.room-info{color:#64748b;font-size:.8rem;margin-left:auto}
.chevron{color:#64748b;transition:transform .2s;font-size:.9rem}
.room-card.open .chevron{transform:rotate(90deg)}

.room-body{display:none;border-top:1px solid #1e2a3a;padding:16px 18px}
.room-card.open .room-body{display:block}

/* players table */
.players-table{width:100%;border-collapse:collapse;margin-bottom:14px}
.players-table th{
  text-align:left;color:#64748b;font-size:.72rem;letter-spacing:.8px;
  text-transform:uppercase;padding:6px 8px;border-bottom:1px solid #1e2a3a;
}
.players-table td{padding:7px 8px;font-size:.83rem;border-bottom:1px solid #0d111a}
.players-table tr:last-child td{border-bottom:none}
.tag-bot{color:#a855f7;font-size:.7rem;background:#1e1040;border:1px solid #7c3aed;border-radius:10px;padding:1px 7px;margin-left:4px}
.tag-offline{color:#ef4444;font-size:.7rem;background:#1f0707;border:1px solid #7f1d1d;border-radius:10px;padding:1px 7px;margin-left:4px}
.btn-kick{
  padding:3px 10px;border-radius:6px;border:1px solid #7f1d1d;
  background:#1f0707;color:#fca5a5;font-size:.72rem;cursor:pointer;
  transition:background .15s;
}
.btn-kick:hover{background:#7f1d1d;color:#fff}
.btn-kick:disabled{opacity:.4;cursor:not-allowed}

/* log */
.log-area{
  max-height:160px;overflow-y:auto;background:#070a12;border:1px solid #1e2a3a;
  border-radius:8px;padding:10px 12px;font-size:.76rem;color:#64748b;
  line-height:1.7;font-family:'Consolas',monospace;
}
.log-area p{margin:0}

.room-actions{display:flex;gap:10px;margin-bottom:14px}
.btn-close{
  padding:6px 14px;border-radius:7px;border:1px solid #7f1d1d;
  background:#1f0707;color:#fca5a5;font-size:.8rem;font-weight:600;cursor:pointer;
  transition:background .15s;
}
.btn-close:hover{background:#7f1d1d;color:#fff}
.section-label{color:#64748b;font-size:.72rem;letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px}
</style>
</head>
<body>

<div id="header">
  <h1>⚙️ 惡意併購 · 管理後台</h1>
  <div id="header-right">
    <span id="refresh-indicator">自動更新中…</span>
    <a class="btn-logout" href="/admin/logout">登出</a>
  </div>
</div>

<div id="main">

  <!-- 統計 -->
  <div id="stats">
    <div class="stat-card">
      <div class="stat-label">房間數</div>
      <div class="stat-value" id="stat-rooms">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">真人玩家</div>
      <div class="stat-value" id="stat-humans">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">電腦玩家</div>
      <div class="stat-value" id="stat-bots">—</div>
    </div>
  </div>

  <!-- 廣播 -->
  <div id="broadcast-panel">
    <span style="color:#64748b;font-size:.82rem;white-space:nowrap">📢 廣播：</span>
    <input id="broadcast-input" placeholder="輸入要廣播給所有玩家的訊息…" maxlength="100"
      onkeydown="if(event.key==='Enter')sendBroadcast()">
    <button class="btn-broadcast" onclick="sendBroadcast()">發送</button>
    <span id="broadcast-status">✓ 已發送</span>
  </div>

  <!-- 房間列表 -->
  <div>
    <div id="rooms-header">
      <h2>房間列表</h2>
    </div>
    <div id="rooms-container" style="margin-top:12px">
      <div id="empty-msg">目前沒有任何房間</div>
    </div>
  </div>

</div>

<script>
const PHASE_LABEL = {
  lobby:          '大廳',
  draft_identity: '抽身份',
  draft_role:     '選角色',
  choose_card:    '遊戲中',
  in_transit:     '傳遞中',
  discard:        '棄牌',
  game_over:      '已結束',
};

let _openRooms = new Set();

async function fetchRooms(){
  try{
    const res = await fetch('/admin/api/rooms');
    const data = await res.json();
    renderRooms(data.rooms);
    document.getElementById('refresh-indicator').textContent =
      '更新於 ' + new Date().toLocaleTimeString('zh-TW');
  } catch(e){
    document.getElementById('refresh-indicator').textContent = '更新失敗';
  }
}

function renderRooms(rooms){
  const totalHumans = rooms.reduce((s,r)=>s+r.humans,0);
  const totalBots   = rooms.reduce((s,r)=>s+r.bots,0);
  document.getElementById('stat-rooms').textContent  = rooms.length;
  document.getElementById('stat-humans').textContent = totalHumans;
  document.getElementById('stat-bots').textContent   = totalBots;

  const container = document.getElementById('rooms-container');
  const emptyMsg  = document.getElementById('empty-msg');

  if(rooms.length === 0){
    container.innerHTML = '';
    emptyMsg.style.display = 'block';
    return;
  }
  emptyMsg.style.display = 'none';

  // preserve open state
  container.querySelectorAll('.room-card.open').forEach(el=>_openRooms.add(el.dataset.code));

  container.innerHTML = rooms.map(r => {
    const isOpen = _openRooms.has(r.code);
    const phaseClass = 'phase-' + r.phase;
    const phaseLabel = PHASE_LABEL[r.phase] || r.phase;

    const playerRows = r.players.map(p => {
      const botTag      = p.is_bot    ? '<span class="tag-bot">Bot</span>'     : '';
      const offlineTag  = !p.connected && !p.is_bot ? '<span class="tag-offline">離線</span>' : '';
      const kickBtn     = !p.is_bot
        ? `<button class="btn-kick" onclick="kickPlayer('${r.code}','${p.pid}',this)">踢出</button>`
        : '<button class="btn-kick" disabled>—</button>';
      return `<tr>
        <td>${escHtml(p.name)}${botTag}${offlineTag}</td>
        <td>${p.black}</td>
        <td>${p.is_bankrupt ? '💀 破產' : '正常'}</td>
        <td>${kickBtn}</td>
      </tr>`;
    }).join('');

    const logLines = r.log.map(l=>`<p>${escHtml(l)}</p>`).join('') || '<p>（無紀錄）</p>';

    return `<div class="room-card${isOpen?' open':''}" data-code="${r.code}">
      <div class="room-header" onclick="toggleRoom('${r.code}',this)">
        <span class="room-code">${r.code}</span>
        <span class="phase-badge ${phaseClass}">${phaseLabel}</span>
        <span class="room-info">真人 ${r.humans} · Bot ${r.bots}</span>
        <span class="chevron">▶</span>
      </div>
      <div class="room-body">
        <div class="room-actions">
          <button class="btn-close" onclick="closeRoom('${r.code}',this)">🗑 強制關閉房間</button>
        </div>
        <div class="section-label">玩家</div>
        <table class="players-table">
          <thead><tr><th>名稱</th><th>黑牌</th><th>狀態</th><th>操作</th></tr></thead>
          <tbody>${playerRows}</tbody>
        </table>
        <div class="section-label">遊戲紀錄（最新20條）</div>
        <div class="log-area">${logLines}</div>
      </div>
    </div>`;
  }).join('');
}

function toggleRoom(code, headerEl){
  const card = headerEl.closest('.room-card');
  const isOpen = card.classList.toggle('open');
  if(isOpen) _openRooms.add(code);
  else        _openRooms.delete(code);
}

function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function closeRoom(code, btn){
  if(!confirm(`確定要強制關閉房間 ${code} 嗎？`)) return;
  btn.disabled = true;
  btn.textContent = '關閉中…';
  const res = await fetch(`/admin/close-room/${code}`, {method:'POST'});
  const data = await res.json();
  if(data.ok) fetchRooms();
  else alert(data.msg);
}

async function kickPlayer(code, pid, btn){
  if(!confirm('確定要踢出此玩家嗎？')) return;
  btn.disabled = true;
  btn.textContent = '踢出中…';
  await fetch(`/admin/kick/${code}/${pid}`, {method:'POST'});
  setTimeout(fetchRooms, 800);
}

async function sendBroadcast(){
  const input = document.getElementById('broadcast-input');
  const msg = input.value.trim();
  if(!msg) return;
  const res = await fetch('/admin/broadcast', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({msg})
  });
  const data = await res.json();
  if(data.ok){
    input.value = '';
    const status = document.getElementById('broadcast-status');
    status.style.display = 'inline';
    setTimeout(()=> status.style.display='none', 2500);
  }
}

fetchRooms();
setInterval(fetchRooms, 5000);
</script>
</body>
</html>
